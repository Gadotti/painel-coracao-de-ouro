version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Espera a versão "amadurecer" antes de propor (mitiga pacotes comprometidos recém-publicados).
    cooldown:
      default-days: 7
    groups:
      desenvolvimento:
        dependency-type: development
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    # Node 24+ em Alpine não tem imagem linux/arm/v7, que o release publica (Raspberry Pi 32 bits).
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
